[project]
name = "speech"
version = "0.1.0"
description = "Use piper to convert text to speech"
readme = "README.md"
authors = [
    { name = "Slade Matthews", email = "53508159+sladem-tox@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "piper-tts>=1.2.0",
    "pygame>=2.6.1",
]

[project.scripts]
speak = "speech.speak:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
